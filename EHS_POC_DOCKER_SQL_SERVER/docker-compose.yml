version: "3.9"

services:

  # ── MS SQL Server ──────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ehs_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EHS_Strong_Pass1!"
      MSSQL_PID: "Developer"          # free Developer edition
    ports:
      - "1433:1433"                   # expose so you can connect with SSMS
    volumes:
      - sqlserver_data:/var/opt/mssql # data persists across restarts
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
            -P "EHS_Strong_Pass1!" -Q "SELECT 1" -No -C
            || exit 1
      interval: 15s
      retries: 10
      start_period: 30s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ehs_api
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY:     ${GROQ_API_KEY}
      GROQ_MODEL:       llama-3.3-70b-versatile
      MSSQL_SERVER:     sqlserver          # docker service name
      MSSQL_PORT:       1433
      MSSQL_DATABASE:   ehs_db
      MSSQL_USER:       sa
      MSSQL_PASSWORD:   EHS_Strong_Pass1!
      REPORTS_DIR:      /app/reports
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
      CHROMA_DB_DIR:    /app/data/chroma_db
      YOLO_MODEL_SIZE:  n
    volumes:
      - reports_data:/app/reports        # JSON backup files
      - chroma_data:/app/data/chroma_db  # vector DB
      - yolo_models:/root/.config/Ultralytics  # cached YOLO weights
    depends_on:
      sqlserver:
        condition: service_healthy       # wait for SQL Server to be ready
    restart: unless-stopped

  # ── Streamlit frontend ─────────────────────────────────────────────────────
  frontend:
    image: python:3.11-slim
    container_name: ehs_frontend
    working_dir: /app
    command: >
      sh -c "pip install streamlit requests plotly pandas --quiet &&
             streamlit run frontend/app.py --server.port 8501
             --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      EHS_API_URL: http://api:8000      # internal docker network
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - api

volumes:
  sqlserver_data:
  reports_data:
  chroma_data:
  yolo_models: